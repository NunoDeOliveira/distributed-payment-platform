# Define a docker compose file for the distributed payment platform

services:
  # Infrastructure
  postgres:
    image: postgres
    container_name: postgres-tfg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: paymentdb,commissiondb,accountdb,movementdb
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq-tfg
    environment:
      RABBITMQ_DEFAULT_USER: nuno
      RABBITMQ_DEFAULT_PASS: rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s

  # Microservices
  payment-service:
    image: nunohenriquedeoliveira/payment-service:latest
    container_name: payment-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/paymentdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=nuno
      - SPRING_RABBITMQ_PASSWORD=rabbit
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  commission-service:
    image: nunohenriquedeoliveira/commission-service:latest
    container_name: commission-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/commissiondb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=nuno
      - SPRING_RABBITMQ_PASSWORD=rabbit
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  account-service:
    image: nunohenriquedeoliveira/account-service:latest
    container_name: account-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/accountdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=nuno
      - SPRING_RABBITMQ_PASSWORD=rabbit
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  ledger-service:
    image: nunohenriquedeoliveira/ledger-service:latest
    container_name: ledger-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/movementdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=nuno
      - SPRING_RABBITMQ_PASSWORD=rabbit
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  api-gateway:
    image: nunohenriquedeoliveira/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=nuno
      - SPRING_RABBITMQ_PASSWORD=rabbit
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Observability
  prometheus:
    container_name: prometheus
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    container_name: grafana
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=nuno
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
