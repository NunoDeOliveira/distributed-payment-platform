# This workflow wdigital-banking-platform will build a Java project with Maven, and cache/restore any d>
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and>


name: CI/CD payment-service

#============= Events for init workflow
on:
  # Method push to run workflow
  push:
    branches:
      - "digital-banking-platform"
    #Only runs if the push modify any file of this microservice
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-service.yml"

  # Method pull_request to run workflow
  pull_request:
    branches:
      - "digital-banking-platform"
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-service.yml"

  # Method to run workflow from web interface
  workflow_dispatch:

#====== Permissions for workflow and concurrency
# Only a single payment workflow is allowed per push or pull
permissions:
  contents: read
  checks: write
concurrency:
  group: payment-service-${{ github.ref }}
  cancel-in-progress: true

#====== define a job to compile docker image and test
jobs:
  build-test-and-publish:
    name: Build, test and publish
    runs-on: ubuntu-latest

    # Temporary services used by integration tests
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: paymentdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:management
        env:
          RABBITMQ_DEFAULT_USER: nuno
          RABBITMQ_DEFAULT_PASS: rabbit
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5672:5672
          - 15672:15672

    #====== Steps: Define a sequence of actions
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    #======= Compile, test anf build the JAR
    - name: Build with Maven
      run: mvn -B clean test --file pom.xml

      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/paymentdb
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres

        SPRING_RABBITMQ_HOST: localhost
        SPRING_RABBITMQ_PORT: 5672
        SPRING_RABBITMQ_USERNAME: nuno
        SPRING_RABBITMQ_PASSWORD: rabbit

    #===== Make Maven test results visible in GitHub Actions. Formate xml
    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        check_name: Payment Service Tests
        files: |
          payment-service/target/surefire-reports/
          payment-service/target/failsafe-reports/

    #========= authenticate Docker Hub
    - name: Log in to Docker Hub
      # check if the conditions before init Docker session
      if: >
        (github.event_name == 'push' || 
        github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/digital-banking-platform'
      uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    #========== build docker image and publish
    - name: Build and optionally push Docker image
      uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
      with:
        context: ./payment-service
        file: ./payment-service/Dockerfile

        push: ${{(github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/digital-banking-platform'}}

        tags: |
          nunohenriquedeoliveira/payment-service:${{ github.sha }}
          nunohenriquedeoliveira/payment-service:latest

        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} 

    #=============== Deployment K3s and verify
  deploy-and-verify:
    name: Deploy and verify
    runs-on: ubuntu-latest
    needs: build-test-and-publish

    if: >
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/digital-banking-platform'

    steps:
      #=== Update the existing Kubernetes Deployment with new image docker in K3s
      - name: Deploy Payment Service
        uses: appleboy/ssh-action@v1.0.0
        with:
            host: ${{ secrets.K3S_HOST }}
            username: ubuntu
            key: ${{ secrets.K3S_SSH_KEY }}
            script: |
              set -e
              sudo k3s kubectl set image deployment/payment-service \
                payment-service=nunohenriquedeoliveira/payment-service:${{ github.sha }} \
                --namespace default

      # ========= Check if the last step end correctly
      - name: Wait for rollout
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -e
            sudo k3s kubectl rollout status \
              deployment/payment-service \
              --namespace default \
              --timeout=300s
    
      #===== Connect to k3 by SSH and check
      - name: Run smoke test
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -e 
            sudo k3s kubectl port-forward service/payment-service 18081:8081 \
              --namespace default >/tmp/payment-port-forward.log 2>&1 &
            
            PORT_FORWARD_PID=$!
            trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT
            
            sleep 5
            
            curl --fail --silent --show-error http://127.0.0.1:18081/actuator/health

      #====== For checking if the deployment fail
      - name: Rollback Payment Service
        if: failure()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            sudo k3s kubectl rollout undo deployment/payment-service \
              --namespace default
              
            sudo k3s kubectl rollout status deployment/payment-service \
              --namespace default \
              --timeout=300s