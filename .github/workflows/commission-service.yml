name: CI/CD commission-service

#============= Events for init workflow
on:
  # Method push to run workflow
  push:
    branches: [ "digital-banking-platform" ]
    # Only runs if the push modifies any file of this microservice
    paths:
      - "commission-service/**"
      - ".github/workflows/commission-service.yml"

  # Method pull_request to run workflow
  pull_request:
    branches: [ "digital-banking-platform" ]
    paths:
      - "commission-service/**"
      - ".github/workflows/commission-service.yml"

  # Method to run workflow from web interface
  workflow_dispatch:

#====== Permissions for workflow and concurrency
# A new workflow run cancels the previous in-progress run for the same branch
permissions:
  contents: read
  checks: write

concurrency:
  group: commission-service-${{ github.ref }}
  cancel-in-progress: true

#====== Define jobs to compile, test, publish and deploy
jobs:
  build-test-and-publish:
    name: Build, test and publish
    runs-on: ubuntu-latest

    # Temporary services used by integration tests
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: commissiondb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:management
        env:
          RABBITMQ_DEFAULT_USER: nuno
          RABBITMQ_DEFAULT_PASS: rabbit
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5672:5672
          - 15672:15672

    #====== Steps: Define a sequence of actions
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      #======= Compile, test and build the JAR
      - name: Build with Maven
        run: mvn -B clean verify --file commission-service/pom.xml
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/commissiondb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: nuno
          SPRING_RABBITMQ_PASSWORD: rabbit

      #===== Make Maven test results visible in GitHub Actions. Format: XML
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Commission Service Tests
          files: |
            commission-service/target/surefire-reports/**/*.xml

      #========= Authenticate Docker Hub
      - name: Log in to Docker Hub
        # Check the conditions before starting the Docker session
        if: >
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/digital-banking-platform'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #========== Build Docker image and optionally publish it
      - name: Build and optionally push Docker image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./commission-service
          file: ./commission-service/Dockerfile

          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/digital-banking-platform' }}

          tags: |
            nunohenriquedeoliveira/commission-service:${{ github.sha }}
            nunohenriquedeoliveira/commission-service:latest

          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}


