# This workflow wdigital-banking-platform will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses 

name: CI/CD payement-service

on:
  push:
    branches: [ ""digital-banking-platform"" ]
    #Only runs if the push modify any file of this microservice 
    paths: 
      - "payment-service/**"
      - ".github/workflows/payment-service.yml"

  pull_request:
    branches: [ "digital-banking-platform" ]
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-service.yml"

# define a job type build 
jobs:
  build:
    # Machine where the job will be running
    runs-on: ubuntu-latest

    # Starting service
    services:
      # First container PostgreSQL
      postgres:
        image: postgres
        env:
          POSTGRES_DB: paymentdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432 

      # Next container RabbitMQ
      rabbitmq:
        image: rabbitmq:management
        env:
          RABBITMQ_DEFAULT_USER: nuno
          RABBITMQ_DEFAULT_PASS: rabbit
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

        cache: maven
    - name: Build with Maven
      run: mvn -B package --file payment-service/pom.xml

    # Authentation in Docker Hub 
    - name: Log in to Docker Hub
      uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Generate image metadata
    - name: Extract metadata for payment-service
      id: meta
      uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
      with:
        images: nunohenriquedeoliveira/payment-service

    # Building and publishing the Docker image
    - name: Build and push payment-service
      uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
      with:
        context: ./payment-service
        file: ./payment-service/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}


    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
     # uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
