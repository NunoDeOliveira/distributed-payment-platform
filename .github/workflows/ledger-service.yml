name: CI/CD ledger-service

on:
  push:
    branches:
      - "digital-banking-platform"
    paths:
      - "ledger-service/**"
      - ".github/workflows/ledger-service.yml"

  pull_request:
    branches:
      - "digital-banking-platform"
    paths:
      - "ledger-service/**"
      - ".github/workflows/ledger-service.yml"

  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ledger-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-publish:
    name: Build, test and publish
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: movementdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:management
        env:
          RABBITMQ_DEFAULT_USER: nuno
          RABBITMQ_DEFAULT_PASS: rabbit
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B clean verify --file ledger-service/pom.xml
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/movementdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: nuno
          SPRING_RABBITMQ_PASSWORD: rabbit

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Ledger Service Tests
          files: |
            ledger-service/target/surefire-reports/**/*.xml

      - name: Log in to Docker Hub
        if: >
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/digital-banking-platform'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./ledger-service
          file: ./ledger-service/Dockerfile

          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/digital-banking-platform' }}

          tags: |
            nunohenriquedeoliveira/ledger-service:${{ github.sha }}
            nunohenriquedeoliveira/ledger-service:latest

          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy-and-verify:
    name: Deploy and verify
    runs-on: ubuntu-latest
    needs: build-test-and-publish

    if: >
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/digital-banking-platform'

    steps:
      - name: Deploy Ledger Service
        id: deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -e

            sudo k3s kubectl set image deployment/movement-service \
              movement-service=nunohenriquedeoliveira/ledger-service:${{ github.sha }} \
              --namespace default

      - name: Wait for rollout
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -e

            sudo k3s kubectl rollout status \
              deployment/movement-service \
              --namespace default \
              --timeout=300s

      - name: Run smoke test
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -e

            sudo k3s kubectl port-forward service/movement-service 18084:8084 \
              --namespace default \
              >/tmp/ledger-port-forward.log 2>&1 &

            PORT_FORWARD_PID=$!
            trap 'sudo kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT

            curl --fail --silent --show-error \
              --retry 10 \
              --retry-delay 3 \
              --retry-connrefused \
              http://127.0.0.1:18084/actuator/health || {
              echo "Ledger Service health check failed"
              cat /tmp/ledger-port-forward.log
              exit 1
            }

      - name: Rollback Ledger Service
        if: failure() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -e

            sudo k3s kubectl rollout undo \
              deployment/movement-service \
              --namespace default

            sudo k3s kubectl rollout status \
              deployment/movement-service \
              --namespace default \
              --timeout=300s
