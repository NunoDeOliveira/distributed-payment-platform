name: CI/CD api-gateway

on:
  push:
    branches:
      - "digital-banking-platform"
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-service.yml"

  pull_request:
    branches:
      - "digital-banking-platform"
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-service.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file api-gateway/pom.xml

      - name: Log in to Docker Hub
        if: >
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/digital-banking-platform'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile

          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/digital-banking-platform' }}

          tags: |
            nunohenriquedeoliveira/api-gateway:${{ github.sha }}
            nunohenriquedeoliveira/api-gateway:latest

          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

