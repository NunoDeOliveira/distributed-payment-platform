name: CI/CD account-service

#============= Events for init workflow
on:
  # Method push to run workflow
  push:
    branches: [ "digital-banking-platform" ]
    # Only runs if the push modifies any file of this microservice
    paths:
      - "account-service/**"
      - ".github/workflows/account-service.yml"

  # Method pull_request to run workflow
  pull_request:
    branches: [ "digital-banking-platform" ]
    paths:
      - "account-service/**"
      - ".github/workflows/account-service.yml"

  # Method to run workflow from web interface
  workflow_dispatch:

#====== Permissions for workflow and concurrency
# A new workflow run cancels the previous in-progress run for the same branch
permissions:
  contents: read
  checks: write

concurrency:
  group: account-service-${{ github.ref }}
  cancel-in-progress: true

#====== Define jobs to compile, test, publish and deploy
jobs:
  build-test-and-publish:
    name: Build, test and publish
    runs-on: ubuntu-latest

    # Temporary services used by integration tests
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: accountdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:management
        env:
          RABBITMQ_DEFAULT_USER: nuno
          RABBITMQ_DEFAULT_PASS: rabbit
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5672:5672
          - 15672:15672

    #====== Steps: Define a sequence of actions
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      #======= Compile, test and build the JAR
      - name: Build with Maven
        run: mvn -B clean verify --file account-service/pom.xml
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/accountdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: nuno
          SPRING_RABBITMQ_PASSWORD: rabbit

      #===== Make Maven test results visible in GitHub Actions. Format: XML
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Account Service Tests
          files: |
            account-service/target/surefire-reports/**/*.xml

      #========= Authenticate Docker Hub
      - name: Log in to Docker Hub
        # Check the conditions before starting the Docker session
        if: >
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/digital-banking-platform'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #========== Build Docker image and optionally publish it
      - name: Build and optionally push Docker image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./account-service
          file: ./account-service/Dockerfile

          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/digital-banking-platform' }}

          tags: |
            nunohenriquedeoliveira/account-service:${{ github.sha }}
            nunohenriquedeoliveira/account-service:latest

          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  #=============== Deployment to K3s and verification
  deploy-and-verify:
    name: Deploy and verify
    runs-on: ubuntu-latest
    needs: build-test-and-publish

    if: >
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/digital-banking-platform'

    steps:
      #=== Update the existing Kubernetes Deployment with the new Docker image in K3s
      - name: Deploy Account Service
        id: deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -e

            sudo k3s kubectl set image deployment/account-service \
              account-service=nunohenriquedeoliveira/account-service:${{ github.sha }} \
              --namespace default

      #========= Check if the previous deployment finished correctly
      - name: Wait for rollout
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -e

            sudo k3s kubectl rollout status \
              deployment/account-service \
              --namespace default \
              --timeout=300s

      #===== Connect to K3s by SSH and check the application health
      - name: Run smoke test
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -e

            sudo k3s kubectl port-forward service/account-service 18083:8083 \
              --namespace default \
              >/tmp/account-port-forward.log 2>&1 &

            PORT_FORWARD_PID=$!
            trap 'sudo kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT

            curl --fail --silent --show-error \
              --retry 10 \
              --retry-delay 3 \
              --retry-connrefused \
              http://127.0.0.1:18083/actuator/health || {
              echo "Account Service health check failed"
              cat /tmp/account-port-forward.log
              exit 1
            }

      #====== Roll back when verification fails after updating the deployment
      - name: Rollback Account Service
        if: failure() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -e

            sudo k3s kubectl rollout undo \
              deployment/account-service \
              --namespace default

            sudo k3s kubectl rollout status \
              deployment/account-service \
              --namespace default \
              --timeout=300s
